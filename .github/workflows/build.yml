name: Build and Inject dylib into IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup insert_dylib
        run: |
          brew install dpkg ldid
          curl -LO https://raw.githubusercontent.com/Tyilo/insert_dylib/master/insert_dylib/main.c
          clang -O2 -o insert_dylib main.c
          sudo mv insert_dylib /usr/local/bin/
          rm main.c

      - name: Download IPA
        run: |
          curl -L "https://files.catbox.moe/4rf15n.ipa" -o app.ipa

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Build Dylib
        run: |
          make clean package FINALPACKAGE=1 THEOS=$HOME/theos

      - name: Inject Dylib into IPA
        run: |
          DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          DYLIB_NAME=$(basename "$DYLIB_PATH")
          
          unzip -q app.ipa -d temp_ipa
          APP_DIR=$(find temp_ipa/Payload -maxdepth 1 -name "*.app")
          
          cp "$DYLIB_PATH" "$APP_DIR/"
          
          plutil -convert xml1 "$APP_DIR/Info.plist"
          EXECUTABLE=$(plutil -extract CFBundleExecutable raw "$APP_DIR/Info.plist")
          
          insert_dylib --inplace --all-yes "@executable_path/$DYLIB_NAME" "$APP_DIR/$EXECUTABLE"
          
          mkdir -p output
          cd temp_ipa
          zip -qr ../output/8BallPool-Modded.ipa Payload
          cd ..

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: 8BallPool-Injected-IPA
          path: output/*.ipa
